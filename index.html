    <style>
        :root {
            --card-width: 140px;
            --card-height: 220px;
            --card-width-sm: 100px;
            --card-height-sm: 160px;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
        }

        h1, h2, h3, .tarot-font {
            font-family: 'Cinzel', 'Noto Serif SC', serif;
        }

        /* Card Styles */
        .tarot-card {
            width: var(--card-width);
            height: var(--card-height);
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        @media (max-width: 768px) {
            .tarot-card {
                width: var(--card-width-sm);
                height: var(--card-height-sm);
            }
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-content.reversed {
            transform: rotate(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #fbbf24;
        }

        .card-back {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23fbbf24' fill-opacity='0.1' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='3'/%3E%3Ccircle cx='13' cy='13' r='3'/%3E%3C/g%3E%3C/svg%3E");
        }

        .card-front {
            background: #f1f5f9;
            color: #1e293b;
            transform: rotateY(180deg);
            padding: 10px;
            overflow: hidden;
        }

        .card-front.major { border-color: #a855f7; background: #faf5ff; }
        .card-front.wands { border-color: #ef4444; background: #fef2f2; }
        .card-front.cups { border-color: #3b82f6; background: #eff6ff; }
        .card-front.swords { border-color: #eab308; background: #fefce8; }
        .card-front.pentacles { border-color: #22c55e; background: #f0fdf4; }

        /* Spread Layouts */
        .spread-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            min-height: 400px;
        }

        /* Celtic Cross Grid */
        .celtic-cross-grid {
            display: grid;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        }

       @media (min-width: 1024px) {
            .celtic-cross-grid {
                grid-template-columns: repeat(6, 1fr);
                grid-template-rows: repeat(6, 1fr);
                height: auto;
                min-height: 700px;
            }
            .pos-1 { grid-column: 2 / 4; grid-row: 2 / 3; justify-self: center; z-index: 1; }
            .pos-2 { grid-column: 2 / 4; grid-row: 2 / 3; justify-self: center; z-index: 2; transform: rotate(90deg) !important; opacity: 0.9; }
            .pos-3 { grid-column: 2 / 4; grid-row: 3 / 4; justify-self: center; }
            .pos-4 { grid-column: 1 / 2; grid-row: 2 / 3; justify-self: end; padding-right: 10px;}
            .pos-5 { grid-column: 2 / 4; grid-row: 1 / 2; justify-self: center; }
            .pos-6 { grid-column: 4 / 5; grid-row: 2 / 3; justify-self: start; padding-left: 10px;}
            .pos-7 { grid-column: 2; grid-row: 5; }
            .pos-8 { grid-column: 3; grid-row: 5; }
            .pos-9 { grid-column: 4; grid-row: 5; }
            .pos-10 { grid-column: 5; grid-row: 5; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        .suit-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 8px;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 4px; }
    </style>

            "cups-11": { name: "圣杯骑士", upright: "理想主义、魅力、优雅、想象力、少年气", reversed: "心碎、情绪化、反复无常、不成熟", yn_upright: "是", yn_reversed: "否" },
            "cups-12": { name: "圣杯王后", upright: "慈悲、平静、滋养、敏感、直觉", reversed: "情感不安、内心动荡、不安全感", yn_upright: "是", yn_reversed: "否" },
            "cups-13": { name: "圣杯国王", upright: "情感平衡、直觉、外交手腕、责任感", reversed: "情感操纵、反复无常、情绪化", yn_upright: "是", yn_reversed: "否" },

            "swords-0":  { name: "宝剑王牌", upright: "清晰、突破、新想法、沟通、真相、新开始", reversed: "困惑、不诚实、沟通受阻、误解", yn_upright: "是", yn_reversed: "否" },
            "swords-1":  { name: "宝剑二", upright: "艰难的选择、犹豫不决、僵局、紧张", reversed: "犹豫不决、清晰、突破、接纳", yn_upright: "否", yn_reversed: "否" },
            "swords-2":  { name: "宝剑三", upright: "心碎、悲伤、哀痛、痛苦、艰难时期、背叛", reversed: "疗愈、宽恕、向前走、恢复、寻求支持", yn_upright: "否", yn_reversed: "是" },
            "swords-3":  { name: "宝剑四", upright: "休息、喘息、冥想、沉思、休养", reversed: "躁动、不安、焦虑、失眠、倦怠", yn_upright: "是", yn_reversed: "否" },
            "swords-4":  { name: "宝剑五", upright: "冲突、失去、背叛、后悔、挫败、暴力", reversed: "和解、解决、内心平静、接纳", yn_upright: "否", yn_reversed: "是" },
            "swords-5":  { name: "宝剑六", upright: "过渡、旅行、离开、向前走、进展", reversed: "抗拒、被困、无法向前、旅行取消", yn_upright: "是", yn_reversed: "否" },
            "swords-6":  { name: "宝剑七", upright: "欺骗、背叛、狡诈、不诚实、鬼祟", reversed: "坦白、诚实、真诚、寻求真相", yn_upright: "否，需谨慎，可能有隐藏的意图，小心", yn_reversed: "是，需谨慎，可能存在不诚实和欺骗" },
            "swords-7":  { name: "宝剑八", upright: "限制、困惑、无力、受害者心态", reversed: "自由、释放、挣脱、赋权", yn_upright: "否", yn_reversed: "是" },
            "swords-8":  { name: "宝剑九", upright: "焦虑、担忧、噩梦、压力、恐惧", reversed: "焦虑缓解、希望、摆脱担忧", yn_upright: "否", yn_reversed: "是" },
            "swords-9":  { name: "宝剑十", upright: "结束、失去、挫败、受害、背叛", reversed: "恢复、接纳、结束、新开始", yn_upright: "否", yn_reversed: "是" },
            "swords-10": { name: "宝剑侍从", upright: "好奇、新想法、求知欲、沟通、青春", reversed: "冲动、欠考虑、伤人的言语", yn_upright: "是", yn_reversed: "否" },
            "swords-11": { name: "宝剑骑士", upright: "理智、沟通、逻辑、追求真相", reversed: "攻击性、欺骗、操纵、好争辩", yn_upright: "是", yn_reversed: "否" },
            "swords-12": { name: "宝剑王后", upright: "智慧、独立、逻辑、洞察、优雅、保护", reversed: "冷漠、苦涩、操纵、严厉、爱评判", yn_upright: "是", yn_reversed: "否" },
            "swords-13": { name: "宝剑国王", upright: "理智、权威、真相、逻辑、分析、智慧", reversed: "残酷、攻击性、严厉、冷漠", yn_upright: "是", yn_reversed: "否" },

            "pentacles-0":  { name: "星币王牌", upright: "新机会、繁荣、丰盛、好运、新开始", reversed: "错失机会、资源匮乏、稀缺、过度消费、财务混乱", yn_upright: "是", yn_reversed: "否" },
            "pentacles-1":  { name: "星币二", upright: "平衡、适应力、时间管理、优先排序", reversed: "失衡、缺乏适应力、混乱无序", yn_upright: "是", yn_reversed: "否" },
            "pentacles-2":  { name: "星币三", upright: "团队合作、协作、学习、建设、工艺", reversed: "缺乏协作、缺乏团队精神、不和谐", yn_upright: "是", yn_reversed: "否，你应该提防身边的某个人" },
            "pentacles-3":  { name: "星币四", upright: "保守、控制、占有欲、物质主义、吝啬", reversed: "放手、分享、慷慨、释放、赌博、冒险", yn_upright: "否", yn_reversed: "是" },
            "pentacles-4":  { name: "星币五", upright: "财务困难、贫困、缺乏支持、被遗弃、失业", reversed: "恢复、援助、丰盛、接纳、还清债务", yn_upright: "否", yn_reversed: "是" },
            "pentacles-5":  { name: "星币六", upright: "慷慨、回报、慈善、分享、公平、感恩", reversed: "吝啬、缺乏慷慨、不平等、滥用权力、贪婪", yn_upright: "是", yn_reversed: "否" },
            "pentacles-6":  { name: "星币七", upright: "坚持、投资获得回报、辛劳得到报偿、成长、耐心", reversed: "短视、缺乏成长、缺乏投入、成果有限", yn_upright: "是", yn_reversed: "否" },
            "pentacles-7":  { name: "星币八", upright: "技能、工艺、专业、学徒、注重细节，你的努力会有回报", reversed: "缺乏技能、缺乏专注、效率低下", yn_upright: "是", yn_reversed: "否" },
            "pentacles-8":  { name: "星币九", upright: "丰盛、繁荣、奢华、独立、自信", reversed: "失去自由、缺乏独立、不安全感、骗局、虚假的成功", yn_upright: "是", yn_reversed: "否" },
            "pentacles-9":  { name: "星币十", upright: "财富、家庭、继承、传承、丰盛、财务稳定", reversed: "损失、缺乏结束、家庭冲突", yn_upright: "是", yn_reversed: "否" },
            "pentacles-10": { name: "星币侍从", upright: "抱负、求知欲、阅读、学识、天赋、显化、新工作、新机会", reversed: "缺乏方向、缺乏动力、急躁、不成熟、拖延", yn_upright: "是", yn_reversed: "否" },
            "pentacles-11": { name: "星币骑士", upright: "可靠、勤奋、传统、责任感、忠诚、效率", reversed: "不可靠、缺乏成长、拖延、不负责任、懒惰", yn_upright: "是", yn_reversed: "否" },
            "pentacles-12": { name: "星币王后", upright: "务实、物质享受、滋养、独立", reversed: "缺乏滋养、缺乏独立、不安全感、操纵", yn_upright: "是", yn_reversed: "否" },
            "pentacles-13": { name: "星币国王", upright: "丰盛、繁荣、安全、领导力、权威", reversed: "缺乏丰盛、缺乏安全感、不配得感、腐败、贪婪", yn_upright: "是", yn_reversed: "否" }
        };

        let currentLang = 'en';
        try { currentLang = localStorage.getItem('tarotLang') === 'zh' ? 'zh' : 'en'; } catch (e) {}

        function t(key) {
            return (i18n[currentLang] && i18n[currentLang][key] !== undefined) ? i18n[currentLang][key] : i18n.en[key];
        }

        function cardText(card, field) {
            if (currentLang === 'zh' && zhCards[card.id] && zhCards[card.id][field]) {
                return zhCards[card.id][field];
            }
            return card[field];
        }

        function applyLang() {
            document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
            document.title = t('docTitle');
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.getAttribute('data-i18n'));
            });
            document.getElementById('lang-toggle-label').textContent = t('toggleLabel');
            if (lastDraw) renderDraw(lastDraw, true);
        }

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            try { localStorage.setItem('tarotLang', currentLang); } catch (e) {}
            applyLang();
        }

        let fullDeck = [];
        let lastDraw = null;

        function toRoman(num) {
            const romans = ["0", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV", "XV", "XVI", "XVII", "XVIII", "XIX", "XX", "XXI"];
            return romans[num];
        }

        function loadCards() {
            const majorArcana = tarotData.majorArcana.map(card => ({
                ...card,
                type: 'Major',
                roman: toRoman(card.number),
                suit: 'Major',
                number: card.number
            }));

            const minorArcana = [
                ...tarotData.minorArcana.wands.map(card => ({ ...card, type: 'Minor', suit: 'Wands', number: card.rank })),
                ...tarotData.minorArcana.cups.map(card => ({ ...card, type: 'Minor', suit: 'Cups', number: card.rank })),
                ...tarotData.minorArcana.swords.map(card => ({ ...card, type: 'Minor', suit: 'Swords', number: card.rank })),
                ...tarotData.minorArcana.pentacles.map(card => ({ ...card, type: 'Minor', suit: 'Pentacles', number: card.rank }))
            ];

            fullDeck = [...majorArcana, ...minorArcana];
            console.log('Cards loaded from embedded data:', fullDeck.length);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCards();
            applyLang();
        });

        function getSpreads(spreadType) {
            return t('spreads')[spreadType];
        }

        function shuffle(array) {
            let currentIndex = array.length,  randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [
                    array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        async function drawCards() {
            if (!fullDeck || fullDeck.length === 0) {
                loadCards();
            }

            const spreadType = parseInt(document.getElementById('spread-select').value);
            const cardsContainer = document.getElementById('cards-container');
            const loading = document.getElementById('loading');
            const readingArea = document.getElementById('reading-area');
            const readingContent = document.getElementById('reading-content');

            cardsContainer.innerHTML = '';
            readingArea.classList.add('hidden');
            readingContent.innerHTML = '';
            loading.classList.remove('hidden');

            await new Promise(r => setTimeout(r, 600));
            loading.classList.add('hidden');

            let deck = shuffle([...fullDeck]);
            let drawn = [];
            for (let i = 0; i < spreadType; i++) {
                drawn.push({ card: deck.pop(), isReversed: Math.random() < 0.5 });
            }

            lastDraw = { spreadType, drawn };
            renderDraw(lastDraw, false);
            document.getElementById('spread-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderDraw(draw, instant) {
            const { spreadType, drawn } = draw;
            const spreadArea = document.getElementById('spread-area');
            const cardsContainer = document.getElementById('cards-container');
            const readingArea = document.getElementById('reading-area');
            const readingContent = document.getElementById('reading-content');
            const positions = getSpreads(spreadType);

            cardsContainer.innerHTML = '';
            readingContent.innerHTML = '';

            if (spreadType === 10) {
                spreadArea.className = instant ? 'celtic-cross-grid' : 'celtic-cross-grid fade-in';
            } else {
                spreadArea.className = instant ? 'spread-container' : 'spread-container fade-in';
            }

            drawn.forEach(({ card, isReversed }, i) => {
                const pos = positions[i];
                const cardEl = createCardElement(card, isReversed, i, spreadType, pos.name, instant);
                cardsContainer.appendChild(cardEl);

                const readingItem = document.createElement('div');
                readingItem.className = 'bg-slate-800 p-4 rounded border border-slate-700 hover:border-amber-500 transition-colors';
                readingItem.innerHTML = `
                    <h3 class="text-amber-400 font-bold mb-1">${i+1}. ${pos.name}</h3>
                    <p class="text-slate-400 text-sm mb-2 italic">${pos.desc}</p>
                    <div class="flex items-center gap-2 mb-2">
                        <span class="font-bold text-lg text-slate-200">${cardText(card, 'name')}</span>
                        <span class="text-xs px-2 py-0.5 rounded ${isReversed ? 'bg-red-900 text-red-200' : 'bg-green-900 text-green-200'}">
                            ${isReversed ? t('reversed') : t('upright')}
                        </span>
                    </div>
                    <p class="text-sm text-slate-300">
                        ${getCardMeaning(card, isReversed)}
                    </p>
                    <p class="text-xs font-bold text-amber-400 mt-1">
                        ${t('yesNo')} ${(isReversed ? cardText(card, 'yn_reversed') : cardText(card, 'yn_upright')) || t('na')}
                    </p>
                `;
                readingContent.appendChild(readingItem);
            });

            readingArea.classList.remove('hidden');
            lucide.createIcons();
        }

        function createCardElement(card, isReversed, index, spreadType, positionLabel, instant) {
            const wrapper = document.createElement('div');
            if (spreadType === 10) {
                wrapper.classList.add(`pos-${index+1}`);
            }

            wrapper.className += ` tarot-card group relative`;

            const label = document.createElement('div');
            label.className = "absolute -top-8 left-0 right-0 text-center text-xs text-amber-400 font-bold opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-10 pointer-events-none";
            label.innerText = `${index+1}. ${positionLabel}`;
            wrapper.appendChild(label);

            const inner = document.createElement('div');
            inner.className = 'card-inner';

            const back = document.createElement('div');
            back.className = 'card-face card-back';
            back.innerHTML = `<div class="w-12 h-12 border-2 border-amber-400/30 rounded-full flex items-center justify-center"><div class="w-8 h-8 border border-amber-400/50 rotate-45"></div></div>`;

            const front = document.createElement('div');
            let suitClass = card.suit.toLowerCase();
            if(card.type === 'Major') suitClass = 'major';

            front.className = `card-face card-front ${suitClass}`;

            const content = document.createElement('div');
            content.className = `card-content flex flex-col items-center justify-between h-full w-full py-2 ${isReversed ? 'reversed' : ''}`;

            const topNum = document.createElement('div');
            topNum.className = "text-sm font-bold opacity-70";
            topNum.innerText = card.roman ? card.roman : card.number;

            const iconDiv = document.createElement('div');
            iconDiv.innerHTML = `<i data-lucide="${getIconName(card.suit)}" class="w-12 h-12 stroke-[1.5]"></i>`;
            if (card.type === 'Major') iconDiv.innerHTML = `<i data-lucide="crown" class="w-12 h-12 stroke-[1.5] text-purple-600"></i>`;

            const nameDiv = document.createElement('div');
            nameDiv.className = "tarot-font text-center font-bold text-sm leading-tight";
            nameDiv.innerText = cardText(card, 'name');

            content.appendChild(topNum);
            content.appendChild(iconDiv);
            content.appendChild(nameDiv);

            front.appendChild(content);
            inner.appendChild(back);
            inner.appendChild(front);
            wrapper.appendChild(inner);

            if (instant) {
                inner.style.transition = 'none';
                inner.classList.add('is-flipped');
            } else {
                setTimeout(() => {
                    inner.classList.add('is-flipped');
                }, 100 + (index * 200));
            }

            return wrapper;
        }

        function getIconName(suit) {
            const normalizedSuit = suit ? suit.charAt(0).toUpperCase() + suit.slice(1).toLowerCase() : '';
            switch(normalizedSuit) {
                case 'Wands': return 'flame';
                case 'Cups': return 'glass-water';
                case 'Swords': return 'sword';
                case 'Pentacles': return 'circle-dashed';
                default: return 'star';
            }
        }

        function getCardMeaning(card, isReversed) {
            if (!card) return '';
            return isReversed ? cardText(card, 'reversed') : cardText(card, 'upright');
        }

        lucide.createIcons();
    </script>
</body>
</html>
